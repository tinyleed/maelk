name: Mælk Harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: Repository harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Mælk harness
        run: ./scripts/maelk-harness-check.sh

      - name: Verify Cloudflare Worker bundle and local preview
        run: npm run test:worker-preview

      - name: Start minimal local Supabase security stack
        run: npm run supabase:start:test

      - name: Run auth and tenant security integration tests
        run: npm run test:security:local

      - name: Stop local Supabase security stack
        if: always()
        run: npm run supabase:stop
